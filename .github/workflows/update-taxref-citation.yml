name: Update TAXREF Citation

on:
  schedule:
    # S'exécute le 1er du mois à 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis GitHub

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Update TAXREF citation
        run: python .github/scripts/update_taxref_citation.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
            commit-message: "chore: mise à jour citation TAXREF"
            title: "chore: mise à jour automatique de la citation TAXREF"
            body: "Mise à jour automatique de la référence bibliographique TAXREF."
            branch: "update-taxref-citation"
            delete-branch: true
